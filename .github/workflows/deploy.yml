name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - name: Install cloudflared
        env:
          CLOUDFLARED_VERSION: "2026.9.1"
        run: |
          curl -fsSL --output cloudflared.deb "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64.deb"
          sudo dpkg -i cloudflared.deb
          cloudflared --version
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          echo "Host deploy.necobotultimus.org
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts" > ~/.ssh/config
      - name: Deploy
        run: ssh ${{ secrets.SERVER_USER }}@deploy.necobotultimus.org "cd ~/necobot && bash deploy.sh"
